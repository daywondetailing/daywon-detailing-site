<a class="skip-link" href="#main">Skip to content</a>
<div class="app-shell" id="app">

      <a class="btn btn--ghost" id="site-link" href="index.html"><svg class="icon" aria-hidden="true"><use href="#i-arrow-right"/></svg><span>Back to website</span></a>
      <button type="button" class="btn btn--ghost" id="signout-btn" hidden><svg class="icon" aria-hidden="true"><use href="#i-logout"/></svg><span>Sign out</span></button>

    <p class="visually-hidden" id="route-live" aria-live="polite"></p>

    </section>
    <section id="view-boot" aria-labelledby="h-boot">
      <h1 id="h-boot" tabindex="-1">Loading</h1>
      <p class="muted">One moment.</p>
    </section>
    <div id="route-root" hidden></div>
  </main>
